# loki/loki-config.yaml — single-binary mode (right-sized for one
# tenant's own operator, not a multi-tenant SaaS deployment). Receives
# push from the main droplet's pingdin-alloy-edge at /loki/api/v1/push
# (config.alloy already targets this — BUILD_LOG Journey 46, unchanged).
#
# Retention: 30 days, matching the metrics window below (Prometheus)
# for consistency — tune later against real disk usage, not guessed.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h  # 30 days
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Managed-tier tenants' own docker logs flow through here (Journey 46's
  # alloy-edge already tails every container on the main droplet) —
  # deliberately generous per-stream limits since a burst of extraction
  # activity across many tenants at once is a real, expected pattern, not
  # an anomaly to throttle away.
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
